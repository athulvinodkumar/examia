version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: examia-postgres
    restart: always
    environment:
      POSTGRES_USER: examia_user
      POSTGRES_PASSWORD: examia_password
      POSTGRES_DB: examia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examia_user -d examia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examia-backend
    restart: always
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://examia_user:examia_password@db:5432/examia_db
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: examia-frontend
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  postgres_data:
